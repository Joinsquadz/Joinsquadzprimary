kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api", "/.well-known"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/api-server", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# Keep the ESM instrumentation preload ahead of the app bundle so Sentry can
# patch Express before it is imported. Production intentionally avoids pnpm for
# startup speed, so this must mirror the package start script explicitly.
args = ["node", "--import", "./artifacts/api-server/dist/instrument.mjs", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"
IOS_APP_ID = "2567CLAZKC.com.squadz.app"
ANDROID_PACKAGE_NAME = "com.squadz.app"
ANDROID_SHA256_CERT_FINGERPRINTS = "FE:7C:A7:AF:18:82:01:91:07:28:02:AA:2E:FD:CA:0A:E5:46:20:E9:2C:1D:43:5D:BE:49:DA:37:39:74:71:19"

[services.production.health.startup]
path = "/api/healthz"